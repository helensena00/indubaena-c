<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="inicio.css">
<title>Baena Industrias Metálicas | Carpintería en Bogotá</title>

</head>
<body>

<header>
  <div class="logo">BAENA<br>INDUSTRIAS<br>METÁLICAS</div>
  <nav>
    <ul>
      <li><a href="inicio.html" class="activo">Inicio</a></li>
      <li><a href="servicios.html">Servicios</a></li>
      <li><a href="cotizaciones.html">Cotizaciones</a></li>
    </ul>
  </nav>
</header>

<section id="cotizaciones">
  <div class="contenedor">
    <h2>Cotizaciones</h2>
    <div class="linea"></div>
    <form action="#" method="post">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" name="telefono" required>

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo">

      <label for="servicio">Servicio que necesitas</label>
      <select id="servicio" name="servicio">
        <option>Carpintería en general</option>
        <option>Puertas</option>
        <option>Closets</option>
        <option>Cocinas integrales</option>
        <option>Reparación y pintura de muebles</option>
      </select>

      <label for="mensaje">Cuéntanos qué necesitas</label>
      <textarea id="mensaje" name="mensaje"></textarea>

      <button type="submit" class="boton">Solicitar cotización</button>
    </form>
  </div>
</section>

<footer>
  <p><strong>Baena Industrias Metálicas</strong> · Bogotá, Colombia</p>
  <p>Teléfono: 000 000 0000 · Correo: correo@pipipi.com</p>
</footer>

</body>
</html>
